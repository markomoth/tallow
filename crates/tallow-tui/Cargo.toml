[package]
name = "tallow-tui"
description = "Terminal frontend for Tallow: rendering and input."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "tallow"
path = "src/main.rs"
required-features = ["terminal"]

[features]
default = ["terminal"]
# The terminal binary. The web build (`tallow-web`) turns this off.
terminal = ["ratatui/crossterm", "dep:directories", "dep:anyhow"]

[dependencies]
tallow-core.workspace = true
ratatui.workspace = true
anyhow = { workspace = true, optional = true }
directories = { workspace = true, optional = true }
serde.workspace = true
ron.workspace = true

[lints]
workspace = true
